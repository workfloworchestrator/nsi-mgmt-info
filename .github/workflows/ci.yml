name: CI

on:
  push:
    branches-ignore:
      - 'dependabot/**'
      - 'renovate/**'
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    # Same-repo branch pushes already run CI; on PRs only run the cases with no
    # push run: forks and the bot branches excluded from the push trigger above.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.fork ||
      startsWith(github.head_ref, 'dependabot/') ||
      startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  mypy:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.fork ||
      startsWith(github.head_ref, 'dependabot/') ||
      startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run mypy amiss

  test:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.fork ||
      startsWith(github.head_ref, 'dependabot/') ||
      startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run pytest
