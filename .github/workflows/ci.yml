name: CI

on:
  push:
    branches-ignore:
      - 'dependabot/**'
      - 'renovate/**'
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    # Same-repo branch pushes already run CI; on PRs only run the cases with no
    # push run: forks and the bot branches excluded from the push trigger above.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.fork ||
      startsWith(github.head_ref, 'dependabot/') ||
      startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  mypy:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.fork ||
      startsWith(github.head_ref, 'dependabot/') ||
      startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run mypy amiss

  test:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.fork ||
      startsWith(github.head_ref, 'dependabot/') ||
      startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run pytest
