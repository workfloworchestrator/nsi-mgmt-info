[build-system]
requires = ["setuptools", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[project]
name = "nsi-mgmt-info"
dynamic = ["version"]
dependencies = [
    "fastapi[standard]==0.141.1",
    "fastui==0.9.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "requests==2.34.2",
    "structlog==26.1.0",
]
requires-python = ">=3.12"
authors = [
    {name = "Arno Bakker"},
    {name = "Hans Trompert"},
]
maintainers = [
    {name = "Arno Bakker"},
    {name = "Hans Trompert"},
]
description = "AMISS, the NSI Management Information Service for the Advanced North Atlantic (ANA) consortium"
readme = "README.md"
keywords = [
    "ANA",
    "NSI",
    "Python",
]
classifiers = [
]

license = "Apache-2.0"
license-files = ["LICENSE.txt"]

[tool.setuptools.packages.find]
include = ["amiss*"]

[tool.setuptools.data-files]
"share/amiss/static" = ["static/*"]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "ruff==0.16.3",
    "types-requests==2.33.0.20260712",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "responses==0.26.2",
]

[project.urls]
# Homepage =
# Documentation =
Repository = "https://github.com/workfloworchestrator/nsi-mgmt-info.git"
# "Bug Tracker" =
# Changelog =

[project.scripts]
nsi-mgmt-info = "amiss.__main__:main"

[project.gui-scripts]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = ["old/*"]
lint.select = [
    "ANN",
    "ARG",
    "B",
    "C",
    "D",
    "E",
    "F",
    "I",
    "N",
    "PGH",
    "PTH",
    "Q",
    "RET",
    "RUF",
    "S",
    "T",
    "W",
]
lint.ignore = [
    "ANN401",
    "B905",
    "C417",
    "C901",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D203",
    "D213",
    "E501",
    "N801",
    "N802",
    "N803",
    "N805",
    "N806",
    "N815",
    "N816",
    "PGH003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101", "D101", "D102", "D103", "D401"]
"tests/conftest.py" = ["E402"]  # imports intentionally after env/PEM setup (see CLAUDE.md)

[tool.mypy]
plugins = ['pydantic.mypy']
ignore_missing_imports = true
disallow_untyped_calls = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = false
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
show_column_numbers = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
